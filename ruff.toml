line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "legacy",
    "build",
    "dist",
    "tests/fixtures",
    "data",
    "src/apsla/samples/python",
    "src/apsla/samples/pending",
    ".pytest-s1",
    ".pytest-s1-full",
    "web",
]

[lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
