# See https://pre-commit.com for more information
# Pre-commit configuration for SecureLex IDE (apsla)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/|^src/apsla/samples/|^legacy/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/|^src/apsla/samples/|^legacy/
      - id: check-yaml
      - id: check-json
        exclude: ^tests/fixtures/|^legacy/
      - id: check-added-large-files
        args: ['--maxkb=10000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-rule-fixtures
        name: Check Rule Fixtures
        entry: python scripts/check_rule_fixtures.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-links
        name: Check Documentation Links
        entry: python scripts/check_links.py
        language: system
        pass_filenames: false
        always_run: true
