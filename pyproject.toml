[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apsla"
version = "0.1.0"
description = "SecureLex IDE - Intelligent Secure Lexical Analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SecureLex IDE Team" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "typer",
    "rich",
    "regex",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "torch",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",
    "radon",
    "hypothesis",
    "codecarbon",
]

[project.scripts]
apsla = "apsla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apsla.samples" = ["manifest.json", "python/*.py", "java/*.java", "javascript/*.js", "cpp/*.cpp", "pending/*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
timeout = 120
timeout_method = "thread"
markers = [
    "security: marks security verification tests",
    "slow: resource-intensive tests with extended timeout",
]
